<!-- templates/guide.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>작물 상세 가이드</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 30px; }
        .container { max-width: 700px; margin: auto; }
        h1 { color: #2c3e50; }
        .section { margin-bottom: 20px; }
        .label { font-weight: bold; color: #333; }
        .value { margin-left: 10px; }
        .back-btn {
            padding: 8px 16px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>작물 가이드: <span id="crop-name">로딩 중...</span></h1>

    <div class="section">
        <div class="label">🌱 재배 방법:</div>
        <div class="value" id="guide">불러오는 중...</div>
    </div>

    <a href="/myfarm" class="back-btn">내 농장으로 이동</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const cropName = urlParams.get("name");

    document.getElementById("crop-name").textContent = cropName;

    fetch(`/guide?name=${cropName}`)
        .then(res => res.text())
        .then(text => {
            document.getElementById("guide").textContent = text;
        })
        .catch(() => {
            document.getElementById("guide").textContent = "가이드를 불러오는 데 실패했습니다.";
        });
</script>
</body>
</html>
