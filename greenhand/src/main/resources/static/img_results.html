<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>초록손 - 상세 진단 결과</title>
    <link rel="stylesheet" href="/css/img.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="app-container">
    <div class="header">🌿 초록손 프로젝트 스토리보드 🌿</div>

    <div class="logout-form-top-right">
        <form action="/logout" method="post">
            <button type="submit" class="logout-button">로그아웃</button>
        </form>
    </div>

    <div class="nav-bar">
        <a href="main.html">내 농장</a>
        <a href="crop_plus.html">작물 추가</a>
        <a href="3.html">재배 가이드</a>
        <a href="img.html" class="active">작물 진단</a>
        <a href="chatbot.html">챗봇 상담</a>
    </div>

    <div class="main-content-panel">
        <section class="diagnosis-detail-section card-group">
            <div class="card-header">상세 진단 결과</div>
            <div class="card-content">
                <h2 id="detailDiagnosisResultSummary"></h2>
                <div class="image-display-area">
                    <img id="detailDiagnosedImageDisplay" src="#" alt="진단된 작물 이미지" style="display: none;" />
                </div>

                <div class="diagnosis-info">
                    <p><strong>심각도:</strong> <span id="detailDiagnosisSeverity"></span></p>
                    <p><strong>작물명:</strong> <span id="detailDiagnosisPlantName"></span></p>
                </div>

                <div class="diagnosis-details-sections">
                    <div class="detail-section" id="detailFeatureSection" style="display: none;">
                        <h3>특징:</h3>
                        <p id="detailFeatureContent"></p>
                    </div>

                    <div class="detail-section" id="detailCauseSection" style="display: none;">
                        <h3>원인:</h3>
                        <p id="detailCauseContent"></p>
                    </div>

                    <div class="detail-section" id="detailSolutionSection" style="display: none;">
                        <h3>해결 방안:</h3>
                        <p id="detailSolutionContent"></p>
                    </div>

                    <div class="detail-section" id="detailFallbackContent" style="display: none;">
                        <h3>상세 내용:</h3>
                        <p id="detailFallbackText"></p>
                    </div>
                </div>

                <button class="btn back-to-diagnosis-btn" onclick="location.href='img.html'">
                    <i class="material-icons">arrow_back</i> 진단 페이지로 돌아가기
                </button>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resultDataRaw = localStorage.getItem('lastDiagnosisResult');
            const imageUrl = localStorage.getItem('lastDiagnosedImageUrl');

            const detailDiagnosisResultSummary = document.getElementById('detailDiagnosisResultSummary');
            const detailDiagnosedImageDisplay = document.getElementById('detailDiagnosedImageDisplay');
            const detailDiagnosisSeverity = document.getElementById('detailDiagnosisSeverity');
            const detailDiagnosisPlantName = document.getElementById('detailDiagnosisPlantName');
            const detailFeatureContent = document.getElementById('detailFeatureContent');
            const detailCauseContent = document.getElementById('detailCauseContent');
            const detailSolutionContent = document.getElementById('detailSolutionContent');
            const detailFallbackContent = document.getElementById('detailFallbackContent');
            const detailFallbackText = document.getElementById('detailFallbackText');

            const detailFeatureSection = document.getElementById('detailFeatureSection');
            const detailCauseSection = document.getElementById('detailCauseSection');
            const detailSolutionSection = document.getElementById('detailSolutionSection');


            if (resultDataRaw) {
                try {
                    const data = JSON.parse(resultDataRaw);
                    console.log("상세 진단 결과 로드:", data);

                    detailDiagnosisResultSummary.textContent = `진단 결과: ${data.diagnosis_result || "정보 없음"}`;
                    detailDiagnosisSeverity.textContent = data.severity || '알 수 없음';
                    detailDiagnosisPlantName.textContent = data.plant_name || '알 수 없음';

                    if (imageUrl) {
                        detailDiagnosedImageDisplay.src = imageUrl;
                        detailDiagnosedImageDisplay.style.display = 'block';
                    }

                    const detailsText = data.diagnosis_details || '';

                    // 정규 표현식을 사용하여 각 섹션 추출 (img.html의 JS와 동일하게)
                    const featureMatch = detailsText.match(/특징:\s*(.*?)(?:\r?\n\s*\r?\n\s*원인:|\r?\n원인:|$)/s);
                    const causeMatch = detailsText.match(/원인:\s*(.*?)(?:\r?\n\s*\r?\n\s*해결 방안:|\r?\n해결 방안:|$)/s);
                    const solutionMatch = detailsText.match(/해결 방안:\s*(.*)/s);

                    let parsedFeature = featureMatch && featureMatch[1] ? featureMatch[1].trim() : '';
                    let parsedCause = causeMatch && causeMatch[1] ? causeMatch[1].trim() : '';
                    let parsedSolution = solutionMatch && solutionMatch[1] ? solutionMatch[1].trim() : '';

                    // 각 섹션의 내용을 표시
                    detailFeatureContent.textContent = parsedFeature || '정보 없음';
                    detailCauseContent.textContent = parsedCause || '정보 없음';
                    detailSolutionContent.textContent = parsedSolution || '정보 없음';

                    // 파싱된 내용이 있다면 해당 섹션을 표시
                    if (parsedFeature !== '') { detailFeatureSection.style.display = 'block'; } else { detailFeatureSection.style.display = 'none'; }
                    if (parsedCause !== '') { detailCauseSection.style.display = 'block'; } else { detailCauseSection.style.display = 'none'; }
                    if (parsedSolution !== '') { detailSolutionSection.style.display = 'block'; } else { detailSolutionSection.style.display = 'none'; }

                    // 만약 모든 섹션이 비어 있는데 원본 텍스트가 있다면 대체 텍스트 표시
                    if (!parsedFeature && !parsedCause && !parsedSolution && detailsText.trim() !== '') {
                        detailFallbackText.textContent = "상세 내용을 파싱할 수 없습니다. 원본 내용: " + detailsText;
                        detailFallbackContent.style.display = 'block';
                    } else if (detailsText.trim() === '') {
                        detailFallbackText.textContent = '상세 정보 없음';
                        detailFallbackContent.style.display = 'block';
                    } else {
                        detailFallbackContent.style.display = 'none';
                    }

                } catch (e) {
                    console.error("저장된 진단 결과 파싱 오류:", e);
                    detailDiagnosisResultSummary.textContent = "진단 결과 로드 중 오류 발생";
                    detailFallbackText.textContent = "저장된 데이터를 불러올 수 없습니다. 다시 진단을 시도해주세요.";
                    detailFallbackContent.style.display = 'block';
                }
            } else {
                console.warn("저장된 진단 결과가 없습니다. img.html에서 진단을 먼저 실행해주세요.");
                detailDiagnosisResultSummary.textContent = "저장된 진단 결과 없음";
                detailFallbackText.textContent = "이전 진단 결과가 없습니다. '작물 진단' 페이지에서 먼저 진단을 실행해주세요.";
                detailFallbackContent.style.display = 'block';
            }
        });
    </script>
</body>
</html>
