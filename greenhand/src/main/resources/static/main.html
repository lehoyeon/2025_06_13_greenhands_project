<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초록손 - 내 농장 (메인)</title>
    <!-- 기존 style.css 대신 main.css 링크로 변경 (상대 경로) -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- 챗봇 관련 CSS 추가 -->
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
<div class="app-container">
    <div class="header">🌿 초록손 프로젝트 스토리보드 🌿</div>

    <div class="logout-form-top-right">
        <form action="/logout" method="post">
            <button type="submit" class="logout-button">로그아웃</button>
        </form>
    </div>

    <div class="nav-bar">
        <button class="hamburger-icon" onclick="toggleNavMenu()">
            <i class="material-icons">menu</i>
        </button>
        <div class="nav-links-container" id="navLinksContainer">
            <a href="main.html" class="active">내 농장</a>
            <a href="crop_plus.html">작물 추가</a>
            <a href="3.html">재배 가이드</a>
            <a href="img.html">작물 진단</a>
            <!-- 챗봇 상담 링크를 이제 페이지 이동 대신 모달을 열도록 수정 -->
            <a href="#" id="chatbotNavLink">챗봇 상담</a>
        </div>
    </div>

    <div class="main-content-panel">
        <section id="mycrops-panel">
            <div class="card">
                <div class="card-header">🏡 내 농장물 진행도 📈</div>
                <div class="card-content">
                    <p style="text-align: center; font-size: 1.1em; color: #000; margin-bottom: 20px;">
                        <span id="current-username-display">불러오는 중...</span>님의 농장</p>
                    <ul class="crop-list">
                        <p style="text-align: center; color: #000;">등록된 작물 정보는 현재 표시되지 않습니다.</p>
                    </ul>
                    <div class="user-crop-details" id="selected-crop-details" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #555;">
                        <p><strong>작물명:</strong> <span id="detail-name">선택 없음</span></p>
                        <p><strong>시작일:</strong> <span id="detail-start-date"></span></p>
                        <p><strong>화분 크기:</strong> <span id="detail-pot-size"></span></p>
                        <p><strong>물의 양:</strong> <span id="detail-water-amount"></span></p>
                        <p><strong>물 주는 주기:</strong> <span id="detail-watering-frequency"></span></p>
                        <p><strong>흙 종류:</strong> <span id="detail-soil-type"></span></p>
                        <p><strong>진행도:</strong> <span id="detail-progress"></span></p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="detail-progress-bar"></div>
                        </div>
                        <button class="btn" style="margin-top: 15px;" onclick="alert('작물 상세 가이드 기능은 현재 구현되지 않았습니다.');">
                            선택 작물 상세 가이드 보기
                        </button>
                        <button class="btn btn-secondary" style="margin-top: 5px;" onclick="alert('작물 삭제 기능은 현재 구현되지 않았습니다.');">
                            선택 작물 삭제
                        </button>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 20px;" onclick="alert('작물 추가 기능은 현재 구현되지 않았습니다.');">
                        + 내 작물 추가
                    </button>
                </div>
            </div>
        </section>
    </div>
</div>

<!-- 챗봇 아이콘 (플로팅 버튼) -->
<div class="chatbot-floating-icon" id="chatbotFloatingIcon">
    <i class="material-icons">chat</i>
</div>

<!-- 챗봇 대화창 컨테이너 -->
<div class="chatbot-modal-container" id="chatbotModalContainer">
    <div class="chatbot-modal-content">
        <!-- 이곳에 기존 chatbot.html의 section#chatbot-panel 안의 모든 내용을 복사하여 붙여넣으세요. -->
        <section id="chatbot-panel">
            <div class="card">
                <div class="card-header">
                    <span id="chatbot-header-title">💬 AI 챗봇 농업 상담 💬</span>
                    <button class="close-chatbot-modal" id="closeChatbotModal">&times;</button> <!-- 닫기 버튼 추가 -->
                </div>
                <div class="card-content">
                    <div id="chat-history">
                        <div class="chat-message bot">
                            <div class="message-info">
                                <span class="message-sender">초록손</span> <span class="message-time">[<span class="current-time"></span>]</span>
                            </div>
                            <div class="message-bubble" id="initial-chatbot-greeting">안녕하세요! 농업에 대해 궁금한 점을 물어보세요.</div>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <input type="text" id="chat-input" placeholder="메시지 입력...">
                        <button id="upload-image-button" class="icon-button">
                            <i class="material-icons">add_photo_alternate</i>
                        </button>
                        <input type="file" id="image-upload-input" name="imageFile" accept="image/*" style="display: none;">
                        <button id="send-chat-message">전송</button>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 10px;" id="show-history-button">이전 질문 내역 확인</button>
                    <!-- "내 농장으로 돌아가기" 버튼은 이제 필요 없거나, 닫기 버튼으로 대체됩니다. -->
                    <!-- <button class="btn" style="width: 100%; margin-top: 20px;" onclick="window.location.href='../main.html'">내 농장으로 돌아가기</button> -->
                </div>
            </div>
        </section>
    </div>
</div>

<!-- 이전 질문 내역 모달은 그대로 유지 (main.html에 그대로 삽입) -->
<div id="history-modal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeHistoryModal()">&times;</span>
        <h2 style="font-size: 20px; margin-bottom: 15px;">이전 질문 내역</h2>
        <div id="history-list">
            <p style="text-align: center; color: #888;">이전 질문을 불러오는 중...</p>
        </div>
        <button class="btn" style="margin-top: 15px;" onclick="closeHistoryModal()">닫기</button>
    </div>
</div>

<!-- 기존 script.js 대신 main.js 링크로 변경 (상대 경로) -->
<script src="js/main.js"></script>
<!-- 챗봇 관련 JavaScript 파일 추가 (main.js 다음에 위치하는 것이 좋습니다.) -->
<script src="js/chatbot.js"></script>
</body>
</html>
