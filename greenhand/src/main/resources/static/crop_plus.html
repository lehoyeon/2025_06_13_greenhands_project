<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>초록손 - 작물 추천</title>
    <link rel="stylesheet" href="/css/crop.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="app-container">
    <div class="header">🌿 초록손 프로젝트 스토리보드 🌿</div>

    <div class="logout-form-top-right">
        <form action="/logout" method="post">
            <button type="submit" class="logout-button">로그아웃</button>
        </form>
    </div>

    <div class="nav-bar">
        <a href="/login/login.html">로그인</a>
        <a href="/login/signup.html">회원가입</a>
        <a href="main.html">내 농장</a>
        <a href="1.html">작물 추가</a>
        <a href="crop_plus.html">작물 추천</a>
        <a href="3.html">재배 가이드</a>
        <a href="img/img.html">작물 진단</a>
        <a href="5.html">문제 해결</a>
        <a href="chatbot/chatbot.html">챗봇 상담</a>
        <a href="7.html">환경 모니터링</a>
        <a href="8.html">실내 농장</a>
    </div>

    <div class="main-content-panel">
        <section class="recommendation-section">
            <div class="card-group">
                <div class="card-header">작물 추천받기</div>
                <div class="card-content horizontal-layout">
                    <div class="recommended-crops-box">
                        <div class="options-area">
                            <label>수확 희망 시기</label>
                            <select id="harvest-select">
                                <option value="">선택</option>
                                <option value="3월">3월</option>
                                <option value="4월">4월</option>
                                <option value="5월">5월</option>
                                <option value="6월">6월</option>
                                <option value="7월">7월</option>
                            </select>
                            <label>재배 장소</label>
                            <select id="env-select">
                                <option value="">선택</option>
                                <option value="실내">실내</option>
                                <option value="실외">실외</option>
                            </select>
                            <button class="btn" id="recommend-btn">+작물추천</button>
                        </div>
                        <div id="recommended-crops"></div>
                    </div>

                    <div class="crop-details-box" id="selected-crop-details" style="display:none;">
                        <p><strong>작물명:</strong> <span id="detail-name"></span></p>
                        <p><strong>적정 화분 크기:</strong> <span id="detail-pot-size"></span></p>
                        <p><strong>적정 물 주기:</strong> <span id="detail-water-amount"></span></p>
                        <p><strong>적정 토지:</strong> <span id="detail-soil-type"></span></p>
                        <p><strong>재배 난이도:</strong>
                            <span id="detail-difficulty-text"></span>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="detail-progress-bar"></div>
                        </div>
                        </p>
                        <button class="btn" id="guide-btn">재배 가이드</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="mycrops-panel">
            <div class="card-group">
                <div class="card-header">재배 리스트</div>
                <div class="card-content">
                    <ul class="crop-list" id="cultivation-list"></ul>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="alert('키우기 기능은 구현 예정입니다.')">키우기</button>
                        <button class="btn btn-secondary" onclick="deleteSelectedCrops()">삭제</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<div id="guide-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeGuideModal()">&times;</span>
        <h3>재배 가이드</h3>
        <ul id="guide-steps"></ul>
    </div>
</div>

<script>
    const recommendBtn = document.getElementById("recommend-btn");
    const cropsContainer = document.getElementById("recommended-crops");
    const detailBox = document.getElementById("selected-crop-details");
    const guideModal = document.getElementById("guide-modal");
    const guideSteps = document.getElementById("guide-steps");

    recommendBtn.addEventListener("click", async () => {
      const harvest = document.getElementById("harvest-select").value;
      const env = document.getElementById("env-select").value;

      if (!harvest || !env) {
        alert("수확 희망 시기와 재배 장소를 선택해주세요.");
        return;
      }

      cropsContainer.innerHTML = "불러오는 중...";

      try {
        const response = await fetch("http://localhost:5000/api/recommend-crop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ harvest, environment: env }),
        });

        const crops = await response.json();

        if (!Array.isArray(crops)) {
          cropsContainer.innerHTML = "추천 작물 형식 오류.";
          return;
        }

        cropsContainer.innerHTML = "";

        crops.forEach((crop, index) => {
          const btn = document.createElement("button");
          btn.textContent = crop.name;
          btn.onclick = () => showDetails(crop);
          cropsContainer.appendChild(btn);
        });
      } catch (err) {
        console.error(err);
        cropsContainer.innerHTML = "추천 실패.";
      }
    });

    function showDetails(crop) {
      detailBox.style.display = "block";
      document.getElementById("detail-name").textContent = crop.name;
      document.getElementById("detail-pot-size").textContent = crop.pot_size;
      document.getElementById("detail-water-amount").textContent = crop.water_amount;
      document.getElementById("detail-soil-type").textContent = crop.soil_type;

      const difficultyMap = { 상: "#f44336", 중: "#ffeb3b", 하: "#2196f3" };
      const diff = crop.difficulty;

      document.getElementById("detail-difficulty-text").textContent = diff;
      const bar = document.getElementById("detail-progress-bar");
      bar.style.width = "100%";
      bar.style.backgroundColor = difficultyMap[diff] || "#ccc";
    }

    document.getElementById("guide-btn").addEventListener("click", () => {
      const steps = [
        "1. 품종 선택",
        "2. 파종 및 모종 준비 (실내/실외)",
        "3. 정식하기",
        "4. 물, 햇빛, 온도 관리"
      ];

      guideSteps.innerHTML = "";
      steps.forEach(step => {
        const li = document.createElement("li");
        li.textContent = step;
        guideSteps.appendChild(li);
      });

      guideModal.style.display = "flex";
    });

    function closeGuideModal() {
      guideModal.style.display = "none";
    }

    function deleteSelectedCrops() {
      alert("선택된 작물을 삭제합니다 (기능 예정)");
    }
</script>
</body>
</html>
