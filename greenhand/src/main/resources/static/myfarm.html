<!-- templates/myfarm.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 농장</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 30px; }
        h1 { color: #2c3e50; }
        table {
            width: 100%; border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc; padding: 10px;
            text-align: left;
        }
        th { background-color: #f5f5f5; }
        .guide-btn {
            background-color: #2980b9;
            color: white;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>🌾 내 농장</h1>

<table id="crop-table">
    <thead>
    <tr>
        <th>작물명</th>
        <th>별칭</th>
        <th>등록일</th>
        <th>가이드</th>
    </tr>
    </thead>
    <tbody>
    <!-- JS로 동적 삽입 -->
    </tbody>
</table>

<script>
    fetch("/api/myfarm") // 백엔드에서 작물 리스트를 JSON으로 제공해야 함
        .then(res => res.json())
        .then(data => {
            const tbody = document.querySelector("#crop-table tbody");
            data.forEach(crop => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${crop.name}</td>
                    <td>${crop.nickname}</td>
                    <td>${crop.registeredAt || "-"}</td>
                    <td>
                        <button class="guide-btn" onclick="location.href='/guide?name=${encodeURIComponent(crop.name)}'">가이드</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(() => {
            alert("내 농장 데이터를 불러오는 데 실패했습니다.");
        });
</script>
</body>
</html>
