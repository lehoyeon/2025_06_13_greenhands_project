<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌱 작물 추천 시스템</title>
    <link rel="stylesheet" href="css/cropstyle.css">
</head>

<body>
<div class="container">
    <div class="header">
        <h1>🌱 작물 추천 시스템</h1>
        <p>당신에게 맞는 작물을 찾아보세요!</p>
    </div>

    <div class="content">
        <div class="form-section">
            <h2 class="section-title">🔍 작물 추천 조건</h2>
            <form id="crop-recommendation-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="harvest-period">📅 재배 희망 시기</label>
                        <select id="harvest-period" required>
                            <option value="" disabled selected>선택하세요</option>
                            <option value="3">3개월 후 수확</option>
                            <option value="6">6개월 후 수확</option>
                            <option value="9">9개월 후 수확</option>
                            <option value="12">1년 후 수확</option>
                            <option value="over">1년 이상</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="region">📍 재배 지역</label>
                        <select id="region" required>
                            <option value="" disabled selected>선택하세요</option>
                            <option value="서울특별시">서울특별시</option>
                            <option value="부산광역시">부산광역시</option>
                            <option value="대구광역시">대구광역시</option>
                            <option value="인천광역시">인천광역시</option>
                            <option value="경기도">경기도</option>
                            <option value="강원도">강원도</option>
                            <option value="충청도">충청도</option>
                            <option value="전라도">전라도</option>
                            <option value="경상도">경상도</option>
                            <option value="제주도">제주도</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="scale">📏 재배 규모</label>
                        <select id="scale" required>
                            <option value="" disabled selected>선택하세요</option>
                            <option value="소규모">소규모 (1~10㎡)</option>
                            <option value="중규모">중규모 (10~100㎡)</option>
                            <option value="대규모">대규모 (100㎡ 이상)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    🌱 작물 추천받기
                </button>
            </form>
        </div>

        <div id="alert-container"></div>

        <div id="recommendations-section" style="display: none;">
            <h2 class="section-title">🌟 추천 작물</h2>
            <div id="recommended-crops" class="recommended-crops"></div>
        </div>

        <div id="other-options-section" style="display: none;">
            <h2 class="section-title">📋 기타 재배 옵션</h2>
            <div id="other-crops" class="recommended-crops"></div>
        </div>

        <div id="my-crops-section">
            <h2 class="section-title">🌿 내 작물 목록</h2>
            <table class="crop-table" id="added-crops-table">
                <thead>
                <tr>
                    <th>작물명</th>
                    <th>설명</th>
                    <th>등록일</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div style="text-align: center; margin: 30px 0;">
            <button id="go-myfarm-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
                내농장으로
            </button>
        </div>
    </div>
</div>

<script src="js/scriptcrop.js"></script>
</body>
</html>
