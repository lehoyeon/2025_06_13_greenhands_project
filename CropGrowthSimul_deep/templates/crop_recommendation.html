<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>초록손 - 작물 추천</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
        .recommend-list li {
          cursor: pointer;
          margin: 5px 0;
          padding: 6px 10px;
          border-radius: 4px;
        }
        .recommend-list li:hover {
          background-color: #d7f0d4;
        }
        .recommend-list li.selected {
          background-color: #8bd88b;
          color: white;
          font-weight: bold;
        }
        .weather-placeholder {
          min-height: 70px;
          max-height: 150px;
          overflow-y: auto;
          font-weight: 600;
          padding: 8px;
          border: 1px solid #ccc;
          background-color: #f9f9f9;
          margin-bottom: 10px;
        }
        .btn {
          padding: 8px 14px;
          border: none;
          background-color: #4CAF50;
          color: white;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
        }
        .btn:disabled {
          background-color: #aaa;
        }
        select#region-select {
          padding: 8px 14px;
          border-radius: 5px;
          border: 1px solid #ccc;
          font-size: 14px;
          margin-bottom: 10px;
          width: 100%;
          max-width: 300px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="초록손 프로젝트 로고" style="height: 40px;">
    </div>

    <div class="nav-bar">
        <a href="/login">로그인</a>
        <a href="sing.html">회원가입</a>
        <a href="/main">내 농장</a>
        <a href="1.html">작물 추가</a>
        <a href="/recommend_crop">작물 추천</a>
        <a href="3.html">재배 가이드</a>
        <a href="4.html">작물 진단</a>
        <a href="5.html">문제 해결</a>
        <a href="6.html">챗봇 상담</a>
    </div>

    <div class="main-content">
        <h2>🌱 현재 날씨 기반 작물 추천</h2>

        <!-- 지역 선택 추가 -->
        <label for="region-select">지역 선택:</label>
        <select id="region-select">
            <option value="서울">서울</option>
            <option value="부산">부산</option>
            <option value="대구">대구</option>
            <option value="인천">인천</option>
            <option value="광주">광주</option>
            <option value="대전">대전</option>
            <option value="울산">울산</option>
            <option value="세종">세종</option>
            <option value="경기도">경기도</option>
            <option value="강원도">강원도</option>
            <option value="충청북도">충청북도</option>
            <option value="충청남도">충청남도</option>
            <option value="전라북도">전라북도</option>
            <option value="전라남도">전라남도</option>
            <option value="경상북도">경상북도</option>
            <option value="경상남도">경상남도</option>
            <option value="제주도">제주도</option>
        </select>

        <div class="weather-placeholder">
            현재 날씨 정보가 여기에 표시됩니다.
        </div>

        <button id="fetch-recommend-btn" class="btn">🌾 작물 추천 받기</button>

        <h3>추천 작물 목록:</h3>
        <ul class="recommend-list">
            <li>위 버튼을 클릭해 추천을 받아보세요.</li>
        </ul>

        <button id="guide-button" class="btn" disabled>📘 선택한 작물 가이드 보기</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      // 네비게이션 활성화
      const currentPath = window.location.pathname.split('/').pop();
      const navLinks = document.querySelectorAll('.nav-bar a');
      navLinks.forEach(link => {
        const linkPath = link.getAttribute('href');
        if (linkPath === currentPath) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });

      if (!localStorage.getItem('loggedInUser')) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }

      const recommendBtn = document.getElementById('fetch-recommend-btn');
      const weatherBox = document.querySelector(".weather-placeholder");
      const cropList = document.querySelector(".recommend-list");
      const guideBtn = document.getElementById('guide-button');
      const regionSelect = document.getElementById('region-select');
      let selectedCrop = null;

      guideBtn.addEventListener('click', () => {
        if (selectedCrop) {
          alert(`선택한 작물 "${selectedCrop}"의 재배 가이드로 이동합니다.`);
          window.location.href = '3.html';
        }
      });

      recommendBtn.addEventListener('click', () => {
        recommendBtn.disabled = true;
        recommendBtn.textContent = "🔄 작물 추천 중...";

        const selectedRegion = regionSelect.value;

        fetch(`/api/recommend_crop?region=${encodeURIComponent(selectedRegion)}`)
          .then(res => res.json())
          .then(data => {
            if (data.status === "success") {
              weatherBox.innerHTML = `
                <strong>🌤️ 현재 ${selectedRegion} 날씨 정보</strong><br>
                🌡️ 온도: ${data.weather.temperature}<br>
                💧 습도: ${data.weather.humidity}<br>
                🌧️ 강수량: ${data.weather.rainfall}<br>
              `;

              cropList.innerHTML = "";
              data.recommendations.forEach((rec, idx) => {
                const li = document.createElement("li");
                li.textContent = `${idx + 1}. ${rec.crop} (생육 적합도: ${rec.grade}, 확률: ${Math.round(rec.probability * 100)}%)`;
                li.addEventListener('click', () => {
                  Array.from(cropList.children).forEach(item => item.classList.remove('selected'));
                  li.classList.add('selected');
                  selectedCrop = rec.crop;
                  guideBtn.disabled = false;
                });
                cropList.appendChild(li);
              });
            } else {
              alert("❌ 작물 추천 실패: " + data.message);
              weatherBox.textContent = "날씨 정보를 불러오지 못했습니다.";
            }
          })
          .catch(err => {
            console.error("❌ API 호출 오류:", err);
            alert("서버 연결 실패. Flask 서버가 실행 중인지 확인하세요.");
            weatherBox.textContent = "서버 연결 실패.";
          })
          .finally(() => {
            recommendBtn.disabled = false;
            recommendBtn.textContent = "🌾 작물 추천 받기";
          });
      });
    });
</script>
</body>
</html>
